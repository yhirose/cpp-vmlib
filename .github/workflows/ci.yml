name: ci

on:
  push:
    branches: ['**']
  pull_request:

# A bounded build (`cmake --build` reads this). A bare `-j` compiles every
# translation unit at once, and under the sanitizers one of the larger
# binders alone needs about 1.5 GB (mini-python's, with Apple clang) -- all
# of them together killed the compiler on a hosted runner. Four is
# ubuntu-latest's core count. ctest takes the same bound: run one by one,
# the tests add up to a lane's slowest one many times over (mini-scheme's
# samples alone are half the sanitizer lane's test step), and none of
# them writes a file another reads.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:
  # The ordinary build, on both platforms a host is likely to embed this from.
  # Every lane builds the example front ends too: their samples are golden
  # transcripts from the real languages, and they reach orders and paths
  # (libc++'s, say, on macos) that test/ alone does not.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVMLIB_BUILD_EXAMPLES=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # Every allocation collects. What this catches is the collector taking an
  # object some C++ handle still holds -- the premature-sweep class of bug --
  # anywhere in the whole suite, not only in test_gc.cc's arranged scenes.
  gc-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVMLIB_BUILD_EXAMPLES=ON -DVMLIB_BUILD_BENCH=OFF
      - run: cmake --build build
      # deep_calls is excluded: its hundred-thousand live frames each pin a
      # closure, so an every-allocation collect scans O(depth) heap per call
      # -- the quadratic blowup, not a bug the lane could catch. Everything
      # else runs with a collect at every single allocation.
      - run: ctest --test-dir build --output-on-failure --timeout 900 -E deep_calls
        env:
          COREIR_GC_STRESS: '1'

  # Reference counting is the memory model, so "did anything leak" is a
  # correctness question here rather than a hygiene one. LeakSanitizer sees
  # what the tests' own live-object counts cannot: an object the executor
  # dropped on the floor without the count ever being consulted.
  #
  # A reference cycle is the one thing counting cannot collect, and the tests
  # assert those exist rather than pretending otherwise -- ~Runtime sweeps
  # them at the end of a run, which is what keeps this lane honest instead of
  # suppressed.
  #
  # Two jobs side by side, since the build is nearly all of this lane: the
  # suite (test/ and PL/0), and the example front ends. Not every front end
  # is built here -- they run the executor's same paths over and over, and
  # each one costs a parse of peglib and an instantiation of the whole VM.
  # These four are the ones that reach what the others do not: mini-lua the
  # most host functions, coroutines and drops; mini-culebra host functions,
  # drops and the release order; mini-js the job queue, generators and
  # coroutines; mini-python the most allocation (the bignum), generators
  # and drops. All eight run in the build and gc-stress lanes, and in
  # `just sanitizers`.
  sanitizers:
    name: sanitizers (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: suite
            opt: -O0
            cmake: -DVMLIB_BUILD_EXAMPLES=OFF
          - part: examples
            opt: -O1
            cmake: -DVMLIB_BUILD_EXAMPLES=ON -DVMLIB_BUILD_TESTS=OFF
            frontends: mini-lua mini-culebra mini-js mini-python
    env:
      FRONTENDS: ${{ matrix.frontends }}
    steps:
      - uses: actions/checkout@v4
      # The front ends build at -O1, as AddressSanitizer's own documentation
      # advises: at -O0 their tail-call samples alone take longer than the
      # rest of the suite put together. The suite runs fast either way and
      # compiles two to three times faster at -O0 (test_values.cc and pl0's
      # main.cc under g++ and clang alike), so it keeps -O0.
      # Ninja, because the Makefile generator builds the targets named on
      # --target one after another (its top-level Makefile is .NOTPARALLEL):
      # the four front ends were compiled two files at a time.
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake }}
          -DVMLIB_BUILD_BENCH=OFF
          -DCMAKE_CXX_FLAGS="${{ matrix.opt }} -fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build ${FRONTENDS:+--target $FRONTENDS}
      - run: ctest --test-dir build --output-on-failure ${FRONTENDS:+-R "^(${FRONTENDS// /|})-"}
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # Two numbers, neither a pass/fail gate: the executor microbenchmarks
  # (bench/bench.cc, Core-IR built by hand -- what a change to a call, a
  # binop, or a variable access costs) and five small programs (bare
  # startup, calls, a tight loop, a container, string building) run
  # through each front end's own binary next to the real language it
  # imitates (bench/languages). python3/ruby/node/go already come with the
  # runner image; lua5.4/guile-3.0 are one apt install; dotnet is
  # actions/setup-dotnet; culebra has no package, so its own docs' latest-
  # release binary is fetched directly. bench/languages/run.sh still skips
  # (reports "-") whatever it does not find, which is what keeps a local
  # run honest when one of these is missing there. (Go needs no go.mod
  # here: `go build prog.go` names its file explicitly, which works outside
  # a module.)
  #
  # Both tables go through `tee -a "$GITHUB_STEP_SUMMARY"` rather than a
  # plain append, so they land in the step log as well as on the run's own
  # summary page. GitHub has no API for reading a step summary back -- only
  # the browser can -- and the log is what makes the numbers reachable from
  # a terminal (`gh run view --job=<id> --log`, which is what
  # .claude/commands/ci-bench.md drives). They are still tables in the job
  # summary, not an artifact nobody opens.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 guile-3.0
      # culebra has no apt package; its own docs point at the tagged
      # release's prebuilt binary rather than building from source (see
      # https://github.com/yhirose/culebra/blob/master/docs/handbook.ja.md#1-%E5%B0%8E%E5%85%A5).
      # `/latest/download/...` always resolves to whatever the newest
      # release is, so this needs no version pin to keep working.
      - run: |
          curl -fsSL https://github.com/yhirose/culebra/releases/latest/download/culebra-linux-x64.tar.gz | tar xz
          sudo mv culebra-*/culebra /usr/local/bin/
          culebra --version
      # The two steps below run only bench and the front ends; the test
      # executables are the build and gc-stress lanes' to run.
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVMLIB_BUILD_EXAMPLES=ON -DVMLIB_BUILD_TESTS=OFF
      - run: cmake --build build
      # `shell: bash` for its `-o pipefail`: the default `run:` shell does
      # not have it, and both commands below end in a pipe -- without it a
      # crashed bench or a run.sh that failed outright would be reported as
      # a passing step with an empty table. A *slow* number still gates
      # nothing; that is the part this job does not judge.
      - name: executor benchmarks
        shell: bash
        run: |
          {
            echo '## vmlib executor'
            build/bench/bench --reps 5 | awk -F'\t' 'NR==1{printf "| "; for(i=1;i<=NF;i++) printf "%s | ", $i; print ""; printf "|"; for(i=1;i<=NF;i++) printf " --- |"; print ""; next} {printf "| "; for(i=1;i<=NF;i++) printf "%s | ", $i; print ""}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: language front ends vs. the language they imitate
        shell: bash
        run: |
          {
            echo '## front ends vs. the real language'
            bench/languages/run.sh --reps 3 | awk -F'\t' 'NR==1{printf "| "; for(i=1;i<=NF;i++) printf "%s | ", $i; print ""; printf "|"; for(i=1;i<=NF;i++) printf " --- |"; print ""; next} {printf "| "; for(i=1;i<=NF;i++) printf "%s | ", $i; print ""}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
